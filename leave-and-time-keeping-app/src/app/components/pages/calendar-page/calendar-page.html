<section class="calendar-container">

    <div class="date-container">
      <div class="month-container">
        <p (click)="toggleDisplayMonths()" id="currentMonth">{{ getCurrentMonthName() }}</p>
        @if (this.displayMonths) {
          <div class="month-picker">
            @for (m of this.months; track $index) {
              <p (click)="changeMonth($index)">{{ m }}</p>
            }
          </div>
        }
      </div>

      <p id="currentYear">{{ currentYear }}</p>
    </div>


  <app-calendar [month]="currentMonth" [year]="currentYear" class="calendar" />
</section>
