    <app-project-modal
      [isOpen]="isModalOpen"
      [data]="this.currentProject"
      (close)="closeModal()"
    />

    <app-delete-project-modal
      [isOpen]="isDeleteModalOpen"
      [data]="this.currentProject"
      (close)="closeDeleteModal()"
    />

    <div class="stats-container">
      <button (click)="openModal()">
        <img src="add.png" />
        <label>Add New Project</label>
      </button>

    </div>

    <div class="table">
      <div class="new-entry-title">
        <h3>Current Projects</h3>
      </div>

      <table>
        <thead>
        <tr>
          <th>Project Name</th>
          <th>Client</th>
          <th>Description</th>
          <th>Dated Added</th>
          <th class="status-cell">Status</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
          @for (project of projects(); track project.id) {
            <tr>
              <td>{{ project.name }}</td>
              <td>{{ project.client }}</td>
              <td>{{ project.description }}</td>
              <td>{{ project.created | date: "dd-MMM-yyyy" }}</td>
              <td class="status-cell">{{ project.active ? 'ACTIVE' : 'INACTIVE' }}</td>
              <td class="button-cell">
                <button (click)="openEditModal(project)">Edit</button>
                <button (click)="openDeleteModal(project)">Delete</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
