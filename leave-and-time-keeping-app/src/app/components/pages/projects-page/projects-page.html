<section class="page">

  <div class="title-section">
    <h2>Projects</h2>
  </div>

  <div class="main-section">
    <app-project-modal
      [isOpen]="isModalOpen"
      [data]="this.currentProject"
      (close)="closeModal()"
    />

    <app-delete-project-modal
      [isOpen]="isDeleteModalOpen"
      [data]="this.currentProject"
      (close)="closeDeleteModal()"
    />

    <div class="stats-container">
      <button (click)="openModal()">
        <img src="add.png" />
        <label>Add New Project</label>
      </button>

    </div>

    <div class="table">
      <table>
        <thead>
        <tr>
          <th class="text-column">
            <div class="th-content"><label>Project Name</label> <img src="direction.png" /></div>
          </th>
          <th class="text-column">
            <div class="th-content"><label>Client</label> <img src="direction.png" /></div>
          </th>
          <th class="text-column">
            <div class="th-content"><label>Description</label> <img src="direction.png" /></div>
          </th>
          <th class="text-column">
            <div class="th-content"><label>Dated Added</label> <img src="direction.png" /></div>
          </th>
          <th class="number-column">
            <div class="th-content status-cell"><label>Status</label> <img src="direction.png" /></div>
          </th>
          <th></th>
        </tr>
        </thead>
        <tbody>
          @for (project of projects(); track project.id) {
            <tr>
              <td>{{ project.name }}</td>
              <td>{{ project.client }}</td>
              <td>{{ project.description }}</td>
              <td>{{ project.created | date: "dd-MMM-yyyy" }}</td>

              @if (project.active) {
                <td><label class="yes-data">ACTIVE</label></td>
              } @else {
                <td><label class="no-data">INACTIVE</label></td>
              }
<!--              <td class="status-cell">{{ project.active ? 'ACTIVE' : 'INACTIVE' }}</td>-->
              <td class="button-cell">
                <button class="edit-btn" (click)="openEditModal(project)">Edit</button>
                <button class="delete-btn" (click)="openDeleteModal(project)">Delete</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</section>
