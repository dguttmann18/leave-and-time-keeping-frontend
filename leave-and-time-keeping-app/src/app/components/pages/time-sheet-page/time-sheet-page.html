<section class="page">

  <div class="title-section">
    <h2>Timesheets</h2>
  </div>

  <div class="main-section">
    <app-time-sheet-modal
      [isOpen]="isModalOpen"
      [data]="currentTimeSheetEntry"
      (close)="closeModal()"
    />

    <app-delete-time-sheet-modal
      [isOpen]="isDeleteModalOpen"
      [data]="this.currentTimeSheetEntry"
      (close)="closeDeleteModal()"
    />

    <div class="stats-container">
      <button (click)="openAddModal()">
        <img src="add.png" />
        <label>Add New Entry</label>
      </button>

      <div class="stats-items">
        <div class="stats-item">
          <label>Hours Logged</label>
          <p>40</p>
        </div>

        <div class="stats-item">
          <label>Leave Due</label>
          <p>5 days 2 hours</p>
        </div>
      </div>

    </div>

    <div class="table">
      <div class="new-entry-title">
        <h3>Logged Time</h3>

        <div class="title-items">
          <div class="title-item">
            <label>From:</label>
            <input type="date" />
          </div>

          <div class="title-item">
            <label>To:</label>
            <input type="date" />
          </div>
        </div>
      </div>

      <table>
        <thead>
        <tr>
          <th class="text-column">
            <div class="th-content"><label>Date</label> <img src="direction.png" /></div>
          </th>
          <th class="text-column">
            <div class="th-content"><label>Project</label> <img src="direction.png" /></div>
          </th>
          <th class="text-column">
            <div class="th-content"><label>Description</label> <img src="direction.png" /></div>
          </th>
          <th class="text-column">
            <div class="th-content"><label>Billable</label> <img src="direction.png" /></div>
          </th>
          <th class="number-column">
            <div class="th-content"><label>Hours</label> <img src="direction.png" /></div>
          </th>
          <th></th>
        </tr>
        </thead>
        <tbody>
          @for (entry of timesheets(); track entry.id) {
            <tr>
              <td>{{ parseDate(entry.dateOfEntry) | date: "dd-MMM-yyyy" }}</td>
              <td>{{ entry.project?.name }}</td>
              <td>{{ entry.description }}</td>

              @if (entry.billable) {
                <td><label class="yes-data">YES</label></td>
              } @else {
                <td><label class="no-data">NO</label></td>
              }

              <td class="number-column">{{ entry.hours | number: '1.2-2' }}</td>
              <td class="button-cell">
                <button class="edit-btn" (click)="openEditModal(entry)">Edit</button>
                <button class="delete-btn" (click)="openDeleteModal(entry)">Delete</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</section>
