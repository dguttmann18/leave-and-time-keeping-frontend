<app-modal
  [isOpen]="this.isOpen()"
  title="Delete Time Sheet Entry"
  (closeModal)="closeModal()"
>
  <div class="question-container">
    <span>Are you sure you want to delete this time sheet entry?</span>
  </div>

  <div class="button-section">
    <button class="cancel-btn" (click)="closeModal()">Cancel</button>
    <button class="delete-btn" type="submit" (click)="deleteTimeSheetEntry()">Delete</button>
  </div>

</app-modal>
