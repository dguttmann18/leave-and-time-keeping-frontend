<app-modal
  [isOpen]="this.isOpen()"
  title="Time Sheet Entry"
  (closeModal)="closeModal()"
>
  <form class="add-new-entry" [formGroup]="timeSheetForm" (ngSubmit)="saveTimeSheetEntry()">
    <div class="form-item">
      <label>Date:</label>
      <input type="date" formControlName="dateOfEntry" />
    </div>

    <div class="form-item">
      <label>Project:</label>
      <select formControlName="projectId">
        @for (project of projects(); track project.id) {
          @if (project.name && project.name.trim() !== '') {
            <option [ngValue]="project.id">{{ project.name }}</option>
          }
        }
      </select>
    </div>

    <div class="form-item">
      <label>Description:</label>
      <textarea formControlName="description"></textarea>
    </div>

    <div class="form-item">
      <label>Hours:</label>
      <input type="number" formControlName="hours" />
    </div>

    <div class="form-item">
      <label>Billable:</label>
      <input class="check-box" type="checkbox" formControlName="billable" />
    </div>

    <div class="button-section">
      <button class="cancel-btn" (click)="closeModal()">Cancel</button>
      <button class="save-btn" type="submit">Save</button>
    </div>

  </form>
</app-modal>
