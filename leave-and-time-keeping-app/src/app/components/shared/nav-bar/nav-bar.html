<section class="nav-bar">

  <div class="title-section">
    <p>Chronos</p>
    <label>Your ultimate employee management companion</label>
  </div>

  <div class="button-group">

    <div class="button-group-section">
      <div class="tab-section-heading clickable-heading">
        <div class="nav-item">
          <img class="nav-item-img" src="calendar.png" />
          <p (click)="goToCalendar()">Calendar</p>
        </div>
      </div>
    </div>

    <div class="button-group-section">
      <div class="tab-section-heading" (click)="toggleTimeSheetsExpanded()">
        <div class="nav-item">
          <img class="nav-item-img" src="timesheet.png" />
          <p>Time Sheets</p>
        </div>

        @if (this.timeSheetsExpanded) {
          <img
            src="right.png">
        } @else {
          <img src="down.png">
        }
      </div>

      @if (this.timeSheetsExpanded) {
        <div class="tab-section">
          <a
            (click)="logTime()"
            [ngClass]="{'active' : activePage === 'log-time'}"
          >
            Log Time
          </a>
          <a>View Time</a>
          <a
            (click)="goToProjects()"
            [ngClass]="{'active' : activePage === 'projects'}"
          >
            Projects
          </a>
        </div>
      }
    </div>


    <div class="button-group-section">
      <div class="tab-section-heading" (click)="toggleLeaveExpanded()">
        <div class="nav-item">
          <img class="nav-item-img" src="leave.png" />
          <p>Leaves</p>
        </div>

        @if (this.leaveExpanded) {
          <img src="right.png">
        } @else {
          <img src="down.png">
        }
      </div>


      @if (this.leaveExpanded) {
        <div class="tab-section">
          <a (click)="applyForLeave()" [ngClass]="{'active' : activePage === 'apply-for-leave'}">Apply for Leave</a>
          <a>View Leave Availability</a>
        </div>
      }
    </div>
  </div>
</section>
