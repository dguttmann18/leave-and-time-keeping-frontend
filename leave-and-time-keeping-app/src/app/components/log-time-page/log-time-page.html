<section class="timesheets-page">

  <div class="title-section">
    <h2>Timesheets</h2>
  </div>

  <div class="main-section">
    <div class="add-new-entry">
      <div class="new-entry-title">
        <h3>New Entry</h3>
      </div>

      <div class="form-item">
        <label>Date:</label>
        <input type="date" [defaultValue]="Date()"/>
      </div>

      <div class="form-item">
        <label>Project:</label>
        <select>
          @for (project of projects; track project.id) {
            <option>{{ project.name }}</option>
          }
        </select>
      </div>

      <div class="form-item">
        <label>Hours:</label>
        <input type="number"/>
      </div>

      <div class="form-item">
        <label>Billable:</label>
        <input class="check-box" type="checkbox"/>
      </div>


      <div class="button-section">
        <button>Save</button>
      </div>

    </div>

    <div class="timesheet-table">
      <div class="new-entry-title">
        <h3>Logged Time</h3>
      </div>

      <table>
        <thead>
        <tr>
          <th>Date</th>
          <th>Project</th>
          <th>Billable</th>
          <th>Hours</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
          @for (entry of timeSheetEntries; track entry.id) {
            <tr>
              <td>{{ parseDate(entry.dateOfEntry) | date: "dd-MMM-yyyy" }}</td>
              <td>{{ entry.project?.name }}</td>
              <td>{{ entry.billable ? "YES" : "NO" }}</td>
              <td>{{ entry.hours }}</td>
              <td class="button-cell">
                <button>Edit</button>
                <button>Delete</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</section>
